<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rogue Block: Refined</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --grid-bg: #16213e;
            --cell-empty: #0f3460;
            --boss-hp: #e94560;
            --player-hp: #4caf50;
            --player-shield: #2196f3;
            --text-color: #ecf0f1;
            
            --color-attack: #e74c3c;
            --color-heal: #2ecc71;
            --color-shield: #3498db;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }

        /* --- UI & HUD --- */
        #game-ui {
            width: 100%;
            max-width: 400px;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .battle-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .character { text-align: center; width: 45%; }
        .avatar { font-size: 1.8rem; display: block; }
        .bar-container {
            width: 100%; height: 8px; background: #333;
            border-radius: 5px; overflow: hidden; margin-top: 5px;
        }
        .bar-fill { height: 100%; width: 100%; transition: width 0.3s ease; }
        #boss-hp-bar { background-color: var(--boss-hp); }
        #player-hp-bar { background-color: var(--player-hp); }
        #player-shield-bar { background-color: var(--player-shield); width: 0%; }
        .stats { font-size: 0.75rem; opacity: 0.8; margin-top: 2px; }

        /* --- GRID --- */
        #grid-container {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 2px;
            background-color: var(--grid-bg);
            padding: 5px;
            border-radius: 8px;
            /* Ekran boyutuna göre dinamik boyutlandırma */
            width: 85vw;
            max-width: 340px;
            height: 85vw;
            max-height: 340px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .cell {
            background-color: var(--cell-empty);
            border-radius: 3px;
        }
        .cell.filled {
            box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .cell.type-attack { background-color: var(--color-attack); }
        .cell.type-heal { background-color: var(--color-heal); }
        .cell.type-shield { background-color: var(--color-shield); }

        /* --- SHAPE SELECTION AREA --- */
        #shapes-container {
            display: flex;
            justify-content: space-between; /* İyice yay */
            align-items: center;
            width: 90%;
            max-width: 380px;
            margin-top: 30px; /* Grid ile ara mesafe */
            height: 80px;
        }

        .shape-preview {
            position: relative;
            width: 70px;  /* Kutu boyutu sabit */
            height: 70px;
            cursor: pointer;
            /* İçeriği ortalamak için arka plan veya border yok, sadece logic */
        }

        /* Bekleme halindeki küçük bloklar */
        .preview-cell {
            position: absolute;
            width: 18px; /* Hücre boyutu */
            height: 18px;
            border-radius: 2px;
            border: 1px solid rgba(255,255,255,0.2);
            pointer-events: none; /* Tıklamayı engelleme, parent alacak */
        }

        /* --- SÜRÜKLENEN ELEMAN --- */
        .dragging {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.9;
            /* Sürüklerken parmağın üstünde daha büyük gözüksün */
            transform: scale(1.2); 
            transform-origin: center center;
        }

        /* --- EFEKTLER --- */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shake { animation: shake 0.5s; }

        .floating-text {
            position: absolute; font-weight: bold; font-size: 1.2rem;
            pointer-events: none; animation: floatUp 1s forwards;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8); z-index: 2000;
        }
        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }

        #game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none;
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 3000;
        }
        button {
            padding: 15px 30px; font-size: 1.2rem; background: var(--boss-hp);
            border: none; color: white; border-radius: 8px; cursor: pointer; margin-top: 20px;
        }
        .legend { display: flex; gap: 10px; font-size: 0.7rem; justify-content: center; margin-bottom: 5px; }
        .legend-item { display: flex; align-items: center; gap: 4px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }

    </style>
</head>
<body>

    <div id="game-ui">
        <div class="legend">
            <div class="legend-item"><div class="dot" style="background:var(--color-attack)"></div> Saldırı</div>
            <div class="legend-item"><div class="dot" style="background:var(--color-heal)"></div> Can</div>
            <div class="legend-item"><div class="dot" style="background:var(--color-shield)"></div> Kalkan</div>
        </div>

        <div class="battle-area">
            <div class="character">
                <span class="avatar">🦸‍♂️</span>
                <div class="stats"><span id="p-hp-txt">100</span> HP | <span id="p-shield-txt">0</span> DEF</div>
                <div class="bar-container"><div id="player-hp-bar" class="bar-fill"></div></div>
                <div class="bar-container" style="margin-top:2px; height:4px;"><div id="player-shield-bar" class="bar-fill"></div></div>
            </div>
            <div style="font-size:1.2rem; font-weight:bold; opacity:0.5">VS</div>
            <div class="character" id="boss-container">
                <span class="avatar">👹</span>
                <div class="stats">Boss: <span id="b-hp-txt">500</span></div>
                <div class="bar-container"><div id="boss-hp-bar" class="bar-fill"></div></div>
            </div>
        </div>
    </div>

    <div id="grid-container"></div>
    <div id="shapes-container"></div>

    <div id="game-over">
        <h1 id="go-title">OYUN BİTTİ</h1>
        <p id="go-msg">Boss kazandı!</p>
        <button onclick="restartGame()">Tekrar Oyna</button>
    </div>

<script>
    // --- OYUN AYARLARI ---
    const GRID_SIZE = 8;
    const MAX_PLAYER_HP = 100;
    const MAX_BOSS_HP = 500;
    const BOSS_DAMAGE = 10;
    // PARMAK OFFSET AYARI: Burayı değiştirerek mesafeyi ayarlayabilirsin
    const DRAG_LIFT_AMOUNT = 100; // Piksel cinsinden yukarı kaydırma

    const TYPE_ATTACK = 'attack';
    const TYPE_HEAL = 'heal';
    const TYPE_SHIELD = 'shield';
    
    let grid = [];
    let playerHP = MAX_PLAYER_HP;
    let playerShield = 0;
    let bossHP = MAX_BOSS_HP;
    let shapes = [];
    let isGameOver = false;

    // Şekil Veritabanı
    const SHAPE_PATTERNS = [
        [[1,1,1,1]], // I
        [[1,1], [1,1]], // O
        [[1,1,1], [0,1,0]], // T
        [[1,1,1], [1,0,0]], // L
        [[1,1,1], [0,0,1]], // J
        [[1,1,0], [0,1,1]], // Z
        [[0,1,1], [1,1,0]], // S
        [[1,1]], // İkili
        [[1]] // Tekli
    ];

    function init() {
        const gridEl = document.getElementById('grid-container');
        gridEl.innerHTML = '';
        grid = [];
        for (let r = 0; r < GRID_SIZE; r++) {
            let row = [];
            for (let c = 0; c < GRID_SIZE; c++) {
                let cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.r = r;
                cell.dataset.c = c;
                gridEl.appendChild(cell);
                row.push({ filled: false, type: null, element: cell });
            }
            grid.push(row);
        }
        playerHP = MAX_PLAYER_HP; playerShield = 0; bossHP = MAX_BOSS_HP;
        isGameOver = false;
        document.getElementById('game-over').style.display = 'none';
        updateUI();
        spawnShapes();
    }

    function spawnShapes() {
        const container = document.getElementById('shapes-container');
        container.innerHTML = '';
        shapes = [];
        for (let i = 0; i < 3; i++) createShapeElement(i);
    }

    function createShapeElement(index) {
        const pattern = SHAPE_PATTERNS[Math.floor(Math.random() * SHAPE_PATTERNS.length)];
        const rand = Math.random();
        let type = TYPE_ATTACK;
        if (rand > 0.5 && rand < 0.8) type = TYPE_SHIELD;
        if (rand >= 0.8) type = TYPE_HEAL;

        const shapeObj = { pattern, type, used: false, id: index };
        shapes[index] = shapeObj;

        const container = document.getElementById('shapes-container');
        const wrapper = document.createElement('div');
        wrapper.classList.add('shape-preview');
        wrapper.dataset.id = index;

        // -- ORTALAMA MANTIĞI --
        // Preview'da hücreler 18px. 4x4 matris varsayımıyla ortalayalım.
        const cellSize = 18;
        const rows = pattern.length;
        const cols = pattern[0].length;
        const shapeWidth = cols * cellSize;
        const shapeHeight = rows * cellSize;
        
        // 70px'lik wrapper'ın ortasına yerleştir
        const startLeft = (70 - shapeWidth) / 2;
        const startTop = (70 - shapeHeight) / 2;

        pattern.forEach((row, r) => {
            row.forEach((val, c) => {
                if (val) {
                    const blk = document.createElement('div');
                    blk.classList.add('preview-cell');
                    blk.style.backgroundColor = `var(--color-${type})`;
                    blk.style.top = (startTop + r * cellSize) + 'px';
                    blk.style.left = (startLeft + c * cellSize) + 'px';
                    wrapper.appendChild(blk);
                }
            });
        });

        addDragEvents(wrapper, shapeObj);
        container.appendChild(wrapper);
    }

    // --- SÜRÜKLE BIRAK SİSTEMİ ---
    let draggedElement = null;
    let currentShape = null;

    function addDragEvents(el, shapeData) {
        const startDrag = (e) => {
            if (shapeData.used || isGameOver) return;
            e.preventDefault();

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            draggedElement = el.cloneNode(true);
            draggedElement.classList.add('dragging');
            
            // Wrapper'ın merkezini parmağa hizala, sonra yukarı kaldır
            const rect = el.getBoundingClientRect();
            // shape-preview width/2 = 35
            
            draggedElement.style.left = (clientX - 35) + 'px'; 
            draggedElement.style.top = (clientY - 35 - DRAG_LIFT_AMOUNT) + 'px';
            
            document.body.appendChild(draggedElement);
            currentShape = shapeData;

            document.addEventListener('mousemove', moveDrag);
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchmove', moveDrag, {passive: false});
            document.addEventListener('touchend', endDrag);
        };

        el.addEventListener('mousedown', startDrag);
        el.addEventListener('touchstart', startDrag, {passive: false});
    }

    function moveDrag(e) {
        if (!draggedElement) return;
        e.preventDefault();
        
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        // OFFSET BURADA UYGULANIYOR
        draggedElement.style.left = (clientX - 35) + 'px';
        draggedElement.style.top = (clientY - 35 - DRAG_LIFT_AMOUNT) + 'px';

        highlightGrid(clientX, clientY - DRAG_LIFT_AMOUNT);
    }

    function endDrag(e) {
        if (!draggedElement) return;

        const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
        const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;

        // Bıraktığımızda da o yukarıdaki offsetli konumu baz alıyoruz
        const placeResult = tryPlace(clientX, clientY - DRAG_LIFT_AMOUNT);

        if (placeResult) {
            placeShape(placeResult.r, placeResult.c, currentShape);
            currentShape.used = true;
            document.querySelector(`.shape-preview[data-id="${currentShape.id}"]`).style.visibility = 'hidden';
            afterMove();
        }

        draggedElement.remove();
        draggedElement = null;
        currentShape = null;
        clearHighlights();
        
        document.removeEventListener('mousemove', moveDrag);
        document.removeEventListener('mouseup', endDrag);
        document.removeEventListener('touchmove', moveDrag);
        document.removeEventListener('touchend', endDrag);
    }

    // --- GRID UTILS ---
    function getGridCoords(x, y) {
        const gridEl = document.getElementById('grid-container');
        const rect = gridEl.getBoundingClientRect();
        
        // Biraz tolerans ekleyelim (grid dışına hafif taşsa bile algılasın)
        const margin = 20; 
        if (x < rect.left - margin || x > rect.right + margin || 
            y < rect.top - margin || y > rect.bottom + margin) return null;

        const cellWidth = rect.width / GRID_SIZE;
        const cellHeight = rect.height / GRID_SIZE;

        // Fare/Parmak şeklin merkezinde, ama şekil matrisinin sol üst köşesi nerede?
        // Şeklin görsel merkezi ile matrisin (0,0) noktası arasındaki farkı hesaplamamız lazım.
        // Basitleştirmek için parmağın olduğu noktayı "şeklin merkezi" kabul edip, matrisi buna göre kaydıracağız.
        
        // Şeklin matris boyutları
        const rows = currentShape.pattern.length;
        const cols = currentShape.pattern[0].length;
        
        // Parmağın bulunduğu mantıksal hücre
        const mouseR = Math.floor((y - rect.top) / cellHeight);
        const mouseC = Math.floor((x - rect.left) / cellWidth);

        // Şekli parmağın ortasına hizalamak için başlangıç (r,c) sini kaydır
        // Örn: 3 birimlik bir çubuğun ortasından tutuyorsak, 1 birim sola kaydırmalıyız.
        const startR = mouseR - Math.floor(rows / 2);
        const startC = mouseC - Math.floor(cols / 2);

        return { r: startR, c: startC };
    }

    function tryPlace(x, y) {
        const coords = getGridCoords(x, y);
        if (!coords) return null;

        const { r, c } = coords;
        const pattern = currentShape.pattern;

        for (let i = 0; i < pattern.length; i++) {
            for (let j = 0; j < pattern[i].length; j++) {
                if (pattern[i][j] === 1) {
                    let targetR = r + i;
                    let targetC = c + j;

                    if (targetR < 0 || targetR >= GRID_SIZE || 
                        targetC < 0 || targetC >= GRID_SIZE || 
                        grid[targetR][targetC].filled) {
                        return null; 
                    }
                }
            }
        }
        return { r, c };
    }

    function placeShape(r, c, shape) {
        const pattern = shape.pattern;
        for (let i = 0; i < pattern.length; i++) {
            for (let j = 0; j < pattern[i].length; j++) {
                if (pattern[i][j] === 1) {
                    const cell = grid[r + i][c + j];
                    cell.filled = true;
                    cell.type = shape.type;
                    cell.element.classList.add('filled', `type-${shape.type}`);
                }
            }
        }
    }

    function highlightGrid(x, y) {
        clearHighlights();
        const coords = tryPlace(x, y);
        if (coords) {
            const { r, c } = coords;
            const pattern = currentShape.pattern;
            for (let i = 0; i < pattern.length; i++) {
                for (let j = 0; j < pattern[i].length; j++) {
                    if (pattern[i][j] === 1) {
                        grid[r+i][c+j].element.style.opacity = '0.5';
                        grid[r+i][c+j].element.style.backgroundColor = `var(--color-${currentShape.type})`;
                    }
                }
            }
        }
    }

    function clearHighlights() {
        grid.forEach(row => row.forEach(cell => {
            if (!cell.filled) {
                cell.element.style.opacity = '1';
                cell.element.style.backgroundColor = '';
            }
        }));
    }

    // --- OYUN MANTIĞI (Aynı) ---
    function afterMove() {
        checkLines();
        if (shapes.every(s => s.used)) spawnShapes();
        bossAttack();
        if (playerHP <= 0) endGame(false);
        else if (bossHP <= 0) endGame(true);
        else checkNoMoves();
        updateUI();
    }

    function checkLines() {
        let rowsToDelete = [];
        let colsToDelete = [];
        for (let r = 0; r < GRID_SIZE; r++) {
            if (grid[r].every(cell => cell.filled)) rowsToDelete.push(r);
        }
        for (let c = 0; c < GRID_SIZE; c++) {
            let colFilled = true;
            for (let r = 0; r < GRID_SIZE; r++) {
                if (!grid[r][c].filled) { colFilled = false; break; }
            }
            if (colFilled) colsToDelete.push(c);
        }

        let totalDamage = 0, totalHeal = 0, totalShield = 0;
        let cellsToClear = [];

        const processCell = (r, c) => {
            if (!grid[r][c].filled) return;
            cellsToClear.push({r, c});
            const type = grid[r][c].type;
            if (type === TYPE_ATTACK) totalDamage += 10;
            if (type === TYPE_HEAL) totalHeal += 5;
            if (type === TYPE_SHIELD) totalShield += 8;
        };

        rowsToDelete.forEach(r => { for(let c=0; c<GRID_SIZE; c++) processCell(r, c); });
        colsToDelete.forEach(c => { for(let r=0; r<GRID_SIZE; r++) processCell(r, c); });

        if (totalDamage > 0) {
            bossHP = Math.max(0, bossHP - totalDamage);
            showFloatText(totalDamage, 'damage', document.getElementById('boss-container'));
            shakeScreen();
        }
        if (totalHeal > 0) {
            playerHP = Math.min(MAX_PLAYER_HP, playerHP + totalHeal);
            showFloatText('+' + totalHeal, 'heal', document.querySelector('.character'));
        }
        if (totalShield > 0) {
            playerShield += totalShield;
            showFloatText('+' + totalShield, 'shield', document.querySelector('.character'));
        }

        cellsToClear.forEach(obj => {
            const cell = grid[obj.r][obj.c];
            cell.filled = false; cell.type = null; cell.element.className = 'cell';
        });
    }

    function bossAttack() {
        if (bossHP <= 0) return;
        let damage = BOSS_DAMAGE;
        if (playerShield > 0) {
            if (playerShield >= damage) { playerShield -= damage; damage = 0; }
            else { damage -= playerShield; playerShield = 0; }
        }
        playerHP -= damage;
        if (damage > 0) {
            showFloatText(-damage, 'damage', document.querySelector('.character'));
            document.body.classList.add('shake');
            setTimeout(() => document.body.classList.remove('shake'), 500);
        }
    }

    function checkNoMoves() {
        const availableShapes = shapes.filter(s => !s.used);
        if (availableShapes.length === 0) return;
        let canMove = false;
        for (let s of availableShapes) {
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    let fits = true;
                    const pat = s.pattern;
                    for(let i=0; i<pat.length; i++){
                        for(let j=0; j<pat[i].length; j++){
                            if(pat[i][j] === 1){
                                if(r+i >= GRID_SIZE || c+j >= GRID_SIZE || grid[r+i][c+j].filled) {
                                    fits = false; break;
                                }
                            }
                        }
                        if(!fits) break;
                    }
                    if(fits) { canMove = true; break; }
                }
                if(canMove) break;
            }
            if(canMove) break;
        }
        if (!canMove) endGame(false, "Yer kalmadı!");
    }

    function updateUI() {
        document.getElementById('p-hp-txt').innerText = Math.ceil(playerHP);
        document.getElementById('p-shield-txt').innerText = playerShield;
        document.getElementById('b-hp-txt').innerText = Math.ceil(bossHP);
        document.getElementById('player-hp-bar').style.width = (playerHP / MAX_PLAYER_HP * 100) + '%';
        document.getElementById('boss-hp-bar').style.width = (bossHP / MAX_BOSS_HP * 100) + '%';
        let shieldPercent = Math.min(100, playerShield * 2);
        document.getElementById('player-shield-bar').style.width = shieldPercent + '%';
    }

    function showFloatText(text, type, targetEl) {
        const floatEl = document.createElement('div');
        floatEl.classList.add('floating-text');
        floatEl.innerText = text;
        const rect = targetEl.getBoundingClientRect();
        floatEl.style.left = (rect.left + rect.width / 2) + 'px';
        floatEl.style.top = rect.top + 'px';
        if (type === 'damage') floatEl.style.color = '#e74c3c';
        if (type === 'heal') floatEl.style.color = '#2ecc71';
        if (type === 'shield') floatEl.style.color = '#3498db';
        document.body.appendChild(floatEl);
        setTimeout(() => floatEl.remove(), 1000);
    }

    function shakeScreen() {
        const gridEl = document.getElementById('grid-container');
        gridEl.classList.add('shake');
        setTimeout(() => gridEl.classList.remove('shake'), 500);
    }

    function endGame(win, msg) {
        isGameOver = true;
        const overlay = document.getElementById('game-over');
        const title = document.getElementById('go-title');
        const message = document.getElementById('go-msg');
        overlay.style.display = 'flex';
        if (win) { title.innerText = "ZAFER!"; title.style.color = "#2ecc71"; message.innerText = "Boss'u yendin!"; } 
        else { title.innerText = "YENİLDİN"; title.style.color = "#e74c3c"; message.innerText = msg || "Canın tükendi."; }
    }
    function restartGame() { init(); }
    init();
</script>
</body>
</html>
